name: Sync release notes

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the notes. Untick it for a dry run that only says what would change."
        type: boolean
        default: true
      drop:
        description: "Versions whose release and tag are thrown away, space separated, e.g. 1.49.0 1.49.1. One with entries in the changelog is refused."
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Put every published release note back in line with the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ inputs.apply }}
          DROP: ${{ inputs.drop }}
        run: |
          set --
          if [ "$APPLY" = "true" ]; then set -- --apply; fi
          if [ -n "$DROP" ]; then set -- "$@" --drop $DROP; fi
          python3 tools/sync_release_notes.py "$@"
